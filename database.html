const $ = id => document.getElementById(id);
let sortKey = "kg_co2e", sortDir = -1;

[...new Set(DATA.map(d => d.category))].forEach(c => $("cat").add(new Option(c, c)));

const maxByUnit = {};
DATA.forEach(d => { maxByUnit[d.unit] = Math.max(maxByUnit[d.unit] || 0, Math.abs(d.kg_co2e)); });

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Math.abs(n) >= 100 ? n.toLocaleString() : Math.abs(n) >= 1 ? n.toFixed(1) : String(+n.toPrecision(2));

function render() {
  const q = $("q").value.trim().toLowerCase(), cat = $("cat").value;
  const list = DATA
    .filter(d => (!cat || d.category === cat) &&
      (!q || (d.item + " " + d.category + " " + d.notes).toLowerCase().includes(q)))
    .sort((a, b) => {
      const x = a[sortKey], y = b[sortKey];
      return (typeof x === "number" ? x - y : x.localeCompare(y)) * sortDir;
    });
  $("count").textContent = `${list.length} of ${DATA.length} items`;
  $("rows").innerHTML = list.map(d => {
    const w = (Math.abs(d.kg_co2e) / maxByUnit[d.unit] * 100).toFixed(1);
    return `<tr>
      <td>${esc(d.item)} <span class="cat">· ${esc(d.category)}</span>
        ${d.notes ? `<div class="note">${esc(d.notes)}</div>` : ""}
        <div class="bar${d.kg_co2e < 0 ? " neg" : ""}" style="width:${w}%"></div></td>
      <td class="num">${fmt(d.kg_co2e)}</td>
      <td>${esc(d.unit)}</td>
      <td class="hide-sm note">${esc(d.source)}</td>
    </tr>`;
  }).join("");
}

document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
  const k = th.dataset.k;
  sortDir = sortKey === k ? -sortDir : (k === "kg_co2e" ? -1 : 1);
  sortKey = k;
  render();
});
$("q").oninput = render;
$("cat").onchange = render;
render();
</script>
